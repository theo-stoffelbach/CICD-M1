[tool.ruff.lint.flake8-bugbear]
# Depends() et Query() sont les idiomes FastAPI standards pour l'injection
# de dépendances dans les signatures d'endpoints : ce ne sont pas de vrais
# appels de fonction évalués une seule fois, FastAPI les inspecte et les
# résout à chaque requête. Sans cette config, B008 remonte un faux positif
# sur chaque endpoint (recommandation officielle de la doc ruff pour FastAPI).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
